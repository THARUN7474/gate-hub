services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: gate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gate_cse
      POSTGRES_USER: gate_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - gate_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gate_user -d gate_cse"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  gate_pgdata:
