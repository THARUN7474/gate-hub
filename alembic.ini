[alembic]
script_location = alembic
prepend_sys_path = .
# URL comes from GATE_DB_URL env var (see alembic/env.py); this is a fallback only.
sqlalchemy.url = sqlite:///data/gate_cse.sqlite

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
